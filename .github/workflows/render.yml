name: render
on:
  push:
    paths: [queue.txt, pdfs/**, server/render.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get install -y -q fonts-crosextra-caladea
          pip install -q -r server/requirements.txt
      - name: render new entries
        run: |
          touch done.txt
          grep -v '^#' queue.txt | grep -v '^\s*$' | while read -r src; do
            grep -qxF "$src" done.txt && continue
            python server/render.py "$src" --out site --no-preview && echo "$src" >> done.txt
          done
      - run: |
          git config user.name  "eink-bot"
          git config user.email "eink-bot@users.noreply.github.com"
          git add site done.txt
          git diff --cached --quiet || git commit -m "render $(date -u +%F)" && git push
